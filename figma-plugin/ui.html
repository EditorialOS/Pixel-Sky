<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --ink:#111111; --muted:#6b6b6b; --line:#e7e7e7; --soft:#f6f6f6; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font:13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding:24px; border-bottom:1px solid var(--line); }
    .eyebrow { font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:5px 0 6px; font-size:25px; line-height:1.1; letter-spacing:-.045em; }
    h2 { margin:0; font-size:14px; letter-spacing:-.01em; }
    p { margin:0; } .muted { color:var(--muted); } .hidden { display:none !important; }
    main { padding:18px 24px 28px; }
    button,input { font:inherit; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); padding:8px 11px; font-weight:540; }
    button:hover { border-color:#999; } button.primary { background:#111; border-color:#111; color:#fff; }
    button.small { padding:7px 9px; font-size:12px; }
    input { width:100%; min-width:0; border:1px solid var(--line); border-radius:7px; background:#fff; padding:10px 11px; color:var(--ink); outline:none; }
    input:focus { border-color:#111; box-shadow:0 0 0 1px #111; }
    .row { display:flex; gap:8px; align-items:center; } .grow { flex:1; }
    .message { margin:0 0 16px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; color:var(--muted); }
    .intro { margin-bottom:18px; } .search { margin-bottom:22px; }
    .result-label { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .asset { min-width:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff; }
    .asset img { display:block; width:100%; height:180px; object-fit:cover; background:var(--soft); }
    .asset-body { padding:10px; } .asset-name { display:block; overflow:hidden; font-size:12px; font-weight:620; text-overflow:ellipsis; white-space:nowrap; }
    .tags { display:flex; gap:5px; min-height:25px; margin:7px 0 8px; overflow:hidden; }
    .tag { max-width:100%; overflow:hidden; padding:3px 6px; border-radius:999px; background:var(--soft); color:#555; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .asset-actions { display:flex; gap:6px; } .asset-actions button { flex:1; }
    .empty { padding:24px 0; color:var(--muted); } .footer { margin-top:24px; }
  </style>
</head>
<body>
  <header><div class="eyebrow">PixelSky / Figma</div><h1>Search assets. Place instantly.</h1><p class="muted">Workspace-scoped Cloudinary assets, ready for your canvas.</p></header>
  <main>
    <p id="message" class="message hidden" role="status"></p>
    <div id="connect"><p class="muted intro">Connect once to search the PixelSky library available to your workspace.</p><button class="primary" id="connectButton">Connect PixelSky</button></div>
    <div id="workspace" class="hidden">
      <div class="row search"><input id="query" class="grow" placeholder="Search: coastal hotel at sunset" /><button class="primary" id="searchButton">Search</button></div>
      <div class="result-label"><h2 id="resultTitle">Search your library</h2><span id="scopeNote" class="muted"></span></div>
      <div id="results" class="grid"></div>
      <div class="footer"><button class="small" id="disconnectButton">Disconnect workspace</button></div>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const post = (type, data = {}) => parent.postMessage({ pluginMessage: { type, ...data } }, '*');
    function message(value) { $('message').textContent = value; $('message').classList.toggle('hidden', !value); }
    function setConnected(value) { $('connect').classList.toggle('hidden', value); $('workspace').classList.toggle('hidden', !value); }
    function search() { post('SEARCH', { query: $('query').value }); }
    $('connectButton').onclick = () => { message('Opening PixelSky sign-in...'); post('CONNECT'); };
    $('disconnectButton').onclick = () => { post('DISCONNECT'); message('Disconnected.'); };
    $('searchButton').onclick = search;
    $('query').onkeydown = (event) => { if (event.key === 'Enter') { event.preventDefault(); search(); } };
    function tagsFor(asset) { return [...(asset.visual_tags || []), ...(asset.tags || [])].filter((tag, index, all) => tag && all.indexOf(tag) === index).slice(0, 2); }
    function renderResults(assets, outsideScopeMatches) {
      const root = $('results'); root.replaceChildren();
      $('resultTitle').textContent = assets.length ? `${assets.length} matching assets` : 'No matching assets';
      $('scopeNote').textContent = outsideScopeMatches ? `${outsideScopeMatches} outside your workspace` : '';
      if (!assets.length) { const note = document.createElement('p'); note.className = 'empty'; note.textContent = 'Try a shorter search, a campaign name, or a Cloudinary tag.'; root.append(note); return; }
      for (const asset of assets) {
        const card = document.createElement('article'); card.className = 'asset';
        const image = document.createElement('img'); image.src = asset.preview_url; image.alt = asset.filename; image.loading = 'lazy';
        const body = document.createElement('div'); body.className = 'asset-body';
        const name = document.createElement('span'); name.className = 'asset-name'; name.textContent = asset.filename;
        const tags = document.createElement('div'); tags.className = 'tags';
        for (const tag of tagsFor(asset)) { const chip = document.createElement('span'); chip.className = 'tag'; chip.textContent = tag; tags.append(chip); }
        const actions = document.createElement('div'); actions.className = 'asset-actions';
        const place = document.createElement('button'); place.className = 'primary small'; place.textContent = 'Place'; place.onclick = () => post('PLACE', { publicId: asset.public_id });
        const download = document.createElement('button'); download.className = 'small'; download.textContent = 'Download'; download.onclick = () => post('DOWNLOAD', { publicId: asset.public_id });
        actions.append(place, download); body.append(name, tags, actions); card.append(image, body); root.append(card);
      }
    }
    onmessage = (event) => {
      const data = event.data.pluginMessage; if (!data) return;
      switch (data.type) {
        case 'STATE': setConnected(data.connected); break;
        case 'CONNECTED': setConnected(true); message(data.message); break;
        case 'DISCONNECTED': setConnected(false); break;
        case 'PAIRING': case 'ERROR': case 'PLACED': case 'DOWNLOADED': message(data.message); break;
        case 'RESULTS': renderResults(data.assets, data.outsideScopeMatches); break;
      }
    };
  </script>
</body>
</html>
